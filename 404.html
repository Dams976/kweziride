<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Page introuvable — KweziRide</title>
  <!-- Favicon -->
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48x48.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    .icon-badge{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:50%;background:var(--night);flex-shrink:0;}
    .icon-badge i{font-size:18px;color:#fff;}
    .icon-badge.accent{background:var(--sun);}
    .dot{display:inline-block;width:9px;height:9px;border-radius:50%;flex-shrink:0;}

    :root{--ocean:#1E7FD4;--sun:#F5820A;--coral:#E8400A;--night:#0A0A0A;--white:#FAFCFF;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--night);color:var(--white);overflow:hidden;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;}
    a{text-decoration:none;color:inherit;}

    /* Étoiles */
    .stars{position:fixed;inset:0;z-index:0;}
    .star{position:absolute;border-radius:50%;background:var(--sun);animation:twinkle 3s infinite ease-in-out;}
    @keyframes twinkle{0%,100%{opacity:.1;transform:scale(1);}50%{opacity:.6;transform:scale(1.5);}}

    /* Contenu */
    .container{position:relative;z-index:1;max-width:560px;}

    /* 404 animé */
    .number-404{font-family:'Unbounded',sans-serif;font-size:clamp(80px,15vw,160px);font-weight:900;line-height:1;background:linear-gradient(135deg,var(--ocean),var(--sun),var(--coral));-webkit-background-clip:text;-webkit-text-fill-color:transparent;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-12px);}}

    /* Voiture animée */
    .car-container{margin:16px 0;font-size:48px;animation:drive 4s ease-in-out infinite;}
    @keyframes drive{0%{transform:translateX(-30px);}50%{transform:translateX(30px);}100%{transform:translateX(-30px);}}

    .title{font-family:'Unbounded',sans-serif;font-size:clamp(18px,3vw,26px);font-weight:900;color:var(--white);margin-bottom:12px;}
    .subtitle{font-size:15px;color:rgba(255,255,255,.55);line-height:1.75;margin-bottom:36px;}
    .subtitle em{color:var(--sun);font-style:normal;font-weight:700;}

    /* Boutons */
    .btns{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
    .btn-primary{padding:14px 28px;border-radius:40px;background:linear-gradient(135deg,var(--sun),var(--coral));color:#fff;font-weight:800;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;transition:transform .2s,box-shadow .2s;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(245,130,10,.4);}
    .btn-secondary{padding:14px 28px;border-radius:40px;border:2px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);font-weight:700;font-size:15px;font-family:'Plus Jakarta Sans',sans-serif;transition:border-color .2s,color .2s;}
    .btn-secondary:hover{border-color:var(--ocean);color:var(--white);}

    /* Logo */
    .logo{position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:10;}
    .logo img{height:50px;width:auto;}

    /* Liens rapides */
    .quick-links{margin-top:32px;display:flex;gap:20px;justify-content:center;flex-wrap:wrap;}
    .quick-link{font-size:13px;color:rgba(255,255,255,.4);transition:color .2s;}
    .quick-link:hover{color:var(--sun);}
  </style>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.33.0/dist/tabler-icons.min.css">
</head>
<body>

  <div class="stars" id="stars"></div>

  <a href="index.html" class="logo">
    <img src="ChatGPT_Image_1_mars_2026__21_18_18.png" alt="KweziRide">
  </a>

  <div class="container">
    <div class="number-404">404</div>

    <div class="car-container"><i class="ti ti-car" style="font-size:48px;"></i></div>

    <h1 class="title">Oups, cette route n'existe pas !</h1>
    <p class="subtitle">
      Le chauffeur s'est perdu quelque part entre <em>Sada</em> et <em>Mamoudzou</em>.<br>
      Cette page n'existe pas ou a été déplacée.
    </p>

    <div class="btns">
      <a href="index.html" class="btn-primary"><i class="ti ti-home"></i> Retour à l'accueil</a>
      <a href="contact.html" class="btn-secondary"><i class="ti ti-message-circle"></i> Nous contacter</a>
    </div>

    <div class="quick-links">
      <a href="index.html#packs" class="quick-link">Nos packs</a>
      <a href="recrutement.html" class="quick-link">Devenir chauffeur</a>
      <a href="actualites.html" class="quick-link">Actualités</a>
      <a href="apropos.html" class="quick-link">À propos</a>
    </div>
  </div>

  <script>
    const container = document.getElementById('stars');
    for (let i = 0; i < 50; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 3 + 1;
      s.style.cssText = `width:${size}px;height:${size}px;top:${Math.random()*100}%;left:${Math.random()*100}%;animation-delay:${Math.random()*4}s;animation-duration:${2+Math.random()*3}s;`;
      container.appendChild(s);
    }
  </script>

</body>
</html>
